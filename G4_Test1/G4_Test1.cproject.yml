# A project translates into one executable or library.
project:

  groups:
    - group: Source Files
      files:
        - file: ./main.c
        - file: ./basics.s
        - file: ./USART.h
        - file: ./USART.c

    - group: Mediums
      files:
        - file: ./mediums/buzzer.h
        - file: ./mediums/buzzer.c
        - file: ./mediums/rgb.h
        - file: ./mediums/rgb.c
        - file: ./mediums/dac.h
        - file: ./mediums/dac.c
        - file: ./mediums/adc.h
        - file: ./mediums/adc.c
        - file: ./mediums/lcd.h
        - file: ./mediums/lcd.c
        - file: ./mediums/i2c.h
        - file: ./mediums/i2c.c
        - file: ./mediums/timebase.h
        - file: ./mediums/timebase.c
        - file: ./mediums/seg.h
        - file: ./mediums/seg.c
        - file: ./mediums/tasks.h
        - file: ./mediums/tasks.c
        - file: ./mediums/iomap.h
        - file: ./mediums/iomap.c
        - file: ./mediums/pot2seg.h
        - file: ./mediums/pot2seg.c
        - file: ./mediums/lcdwatch.h
        - file: ./mediums/lcdwatch.c
        - file: ./mediums/keypad.h
        - file: ./mediums/keypad.c
        - file: ./mediums/arcade.h
        - file: ./mediums/arcade.c

    - group: Device
      files:
        - file: ./Device/system_stm32g4xx.c
        - file: ./Device/startup_stm32g431xx.s

  # List components to use for your application.
  # A software component is a re-usable unit that may be configurable.
  # Device:Startup is intentionally NOT used: this pack's variant only
  # produces real startup/system files via a CubeMX-generated gpdsc, so for a
  # standalone (non-CubeMX) project the startup/system sources above are
  # supplied directly instead.
  components:
    - component: ARM::CMSIS:CORE

  # Explicit linker script (no CubeMX/RTE auto-generation available either).
  linker:
    - script: ./Device/G4_Test1.sct
      for-compiler: AC6

  # List executable file formats to be generated.
  output:
    type:
      - elf
      - hex
      - map
